<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">VICE</span> COVER STUDIO</div>
  <p class="tagline">Turn any photo into a Vice City cover</p>
</header>

<div class="toolbar" id="toolbar">
  <div class="group" id="layoutGroup" role="group" aria-label="Layout"></div>
  <div class="group" id="gradeGroup" role="group" aria-label="Grade"></div>
  <label class="export-size">Export
    <select id="exportSize">
      <option value="landscape">1920 × 1080</option>
      <option value="portrait">1080 × 1350</option>
      <option value="square">1080 × 1080</option>
    </select>
  </label>
  <button id="exportBtn" class="btn primary" type="button">Export PNG</button>
</div>

<main class="workbench">
  <section class="preview-wrap">
    <canvas id="preview"></canvas>
    <p class="hint">Drag a photo to reposition it &middot; use each panel&rsquo;s zoom slider to crop</p>
  </section>
  <aside class="controls" id="controls">
    <section class="card caption-card">
      <h2>Caption</h2>
      <label>Title
        <input id="titleInput" type="text" value="VICE CITY NIGHTS" maxlength="48">
      </label>
      <label>Subtitle
        <input id="subInput" type="text" value="MY AGENT PAID THE BOUNTY" maxlength="48">
      </label>
      <label>Title size
        <input id="titleSize" type="range" min="60" max="140" value="100">
        <span id="titleSizeVal">100%</span>
      </label>
    </section>
    <section class="card panels-card">
      <h2>Photos <button id="fillAllBtn" class="btn small" type="button">Fill all panels</button></h2>
      <div id="panelList"></div>
    </section>
  </aside>
</main>

<footer class="foot">Runs fully offline. No Rockstar assets &mdash; every cover is built from your own photos.</footer>

<script src="src/layouts.js"></script>
<script src="src/grades.js"></script>
<script src="src/cover.js"></script>
<script src="src/main.js"></script>
</body>
</html>
