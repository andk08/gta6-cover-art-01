<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style cover maker</title>
<style>
@font-face {
  font-family: 'Anton';
  src: url('fonts/Anton-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <h1>VICE <span>COVER</span> STUDIO</h1>
  <p>Turn your photos + a caption into a GTA 6-style cover poster.</p>
</header>
<main id="editor">
  <section class="stage">
    <canvas id="cover" width="960" height="960"></canvas>
    <p class="hint">Click a panel to select it, then drag the photo to move it. Scroll over a panel to zoom.</p>
  </section>
  <aside class="controls">
    <section>
      <h2>Layout</h2>
      <div class="row" id="layoutRow"></div>
    </section>
    <section>
      <h2>Grade</h2>
      <div class="row" id="gradeRow"></div>
    </section>
    <section>
      <h2>Photos</h2>
      <div id="panelList"></div>
      <button id="fillAll" type="button">Fill all panels with panel 1's photo</button>
    </section>
    <section>
      <h2>Caption</h2>
      <label>Title <input id="titleInput" type="text" value="VICE CITY NIGHTS" maxlength="60"></label>
      <label>Subtitle <input id="subInput" type="text" value="MY AGENT PAID THE BOUNTY" maxlength="60"></label>
      <label>Title size <input id="titleSize" type="range" min="0.5" max="1.5" step="0.05" value="1"> <span id="titleSizeVal">100%</span></label>
    </section>
    <section>
      <h2>Export</h2>
      <label>Size
        <select id="exportSize">
          <option value="square">Square — 1080 × 1080</option>
          <option value="portrait">Portrait — 1080 × 1350</option>
          <option value="landscape">Landscape — 1920 × 1080</option>
        </select>
      </label>
      <button id="exportBtn" type="button" class="primary">Export PNG</button>
      <p id="status" class="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
