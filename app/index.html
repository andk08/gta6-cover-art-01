<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<style>
@font-face {
  font-family: 'Anton';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/Anton-Regular.ttf') format('truetype');
}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">VICE <span>COVER</span> STUDIO</div>
  <p class="tagline">GTA-style multi-panel cover maker — your photos, your caption, no Rockstar assets, works fully offline.</p>
</header>
<main class="editor">
  <section class="stage">
    <canvas id="preview" width="900" height="900"></canvas>
    <p class="hint">Drag a photo on the cover to pan it. Click a panel to select it.</p>
    <div class="exports">
      <span>Export PNG</span>
      <div id="exportButtons" class="button-row"></div>
    </div>
  </section>
  <aside class="controls">
    <section>
      <h2>Layout</h2>
      <div id="layoutButtons" class="button-row"></div>
    </section>
    <section>
      <h2>Grade</h2>
      <div id="gradeButtons" class="button-row"></div>
    </section>
    <section>
      <h2>Cover size</h2>
      <div id="sizeButtons" class="button-row"></div>
    </section>
    <section>
      <h2>Caption</h2>
      <label>Title <input id="titleInput" type="text" value="VICE CITY" maxlength="48"></label>
      <label>Subtitle <input id="subtitleInput" type="text" value="LEONIDA" maxlength="48"></label>
      <label>Title size <input id="titleSize" type="range" min="0.7" max="1.3" step="0.05" value="1"> <span id="titleSizeValue">100%</span></label>
    </section>
    <section>
      <h2>Photos</h2>
      <div class="fill-all">
        <select id="fillSample">
          <option value="boulevard">Boulevard</option>
          <option value="pier">Pier</option>
        </select>
        <button id="fillAll" type="button">Fill all panels</button>
      </div>
      <div id="panels"></div>
    </section>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
